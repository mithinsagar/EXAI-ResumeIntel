# EXAI-ResumeIntel: Runtime settings
# Author: Mithin Sagar S
# GitHub: https://github.com/mithinsagar

# ─── Application metadata ──────────────────────────────────────────
app:
  name: EXAI-ResumeIntel
  version: "1.0.0"
  author: Mithin Sagar S
  institution: "Vellore Institute of Technology (VIT)"
  contact: mithinsagar@gmail.com

# ─── Scoring engine weights ────────────────────────────────────────
# Component weights sum to 1.0 (paper: eq. 7)
scoring:
  ontology_weight: 0.45
  semantic_weight: 0.30
  depth_weight: 0.15
  corpus_weight: 0.10
  score_cap: 0.97          # cap to prevent false certainty

# ─── Depth sub-score weights ───────────────────────────────────────
depth:
  experience_weight: 0.35
  education_weight: 0.25
  quantified_weight: 0.20
  tool_density_weight: 0.20

# ─── TF-IDF + SVD embedding engine ─────────────────────────────────
embeddings:
  max_features: 10000
  ngram_range: [1, 3]
  min_df: 2
  sublinear_tf: true
  n_components: 150          # SVD components
  n_iter: 7                  # power iterations
  random_state: 42

# ─── XAI ───────────────────────────────────────────────────────────
xai:
  shapley:
    exact_threshold: 12       # use exact SHAP for |F| <= 12
    n_samples: 512            # Kernel SHAP permutations
    random_state: 42
  lime:
    n_samples: 300
    kernel_width: 0.25
    ridge_alpha: 0.01
  counterfactual:
    max_scenarios: 5
    target_increase: 0.10
  interactions:
    max_pairs: 5
    max_skills: 8

# ─── Ontology ──────────────────────────────────────────────────────
ontology:
  parent_decay: 0.8
  ngram_max: 4
  base_confidence: 0.6

# ─── API server ────────────────────────────────────────────────────
api:
  host: 0.0.0.0
  port: 8765
  workers: 1
  log_level: info
  cors_origins:
    - "http://localhost:8080"
    - "http://localhost:8501"
    - "http://localhost:3000"

# ─── Model paths ───────────────────────────────────────────────────
paths:
  embedding_model: models/embedding_engine.pkl
  job_df: models/job_df.pkl
  job_embeddings: models/job_embeddings.memmap
  resume_corpus: data/raw/clean_resume_data.csv
  job_postings: data/raw/jobs_dataset_with_features.csv
  history_db: data/processed/analysis_history.db

# ─── SBERT (Streamlit app) ─────────────────────────────────────────
sbert:
  model_name: sentence-transformers/all-mpnet-base-v2
  batch_size: 32
  normalize_embeddings: false

# ─── Hugging Face Hub ──────────────────────────────────────────────
huggingface:
  data_repo: mithinsagar/exai-resumeintel-data
  model_repo: mithinsagar/exai-resumeintel-models
