# EXAI-ResumeIntel: Full-stack development compose file
# Author: Mithin Sagar S
# GitHub: https://github.com/mithinsagar
#
# Usage:
#   docker-compose -f deployment/docker-compose.yml up -d
#   docker-compose -f deployment/docker-compose.yml down

version: "3.9"

services:

  # ─── FastAPI backend ────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: exai-resumeintel:latest
    container_name: exai-api
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8765"
      API_LOG_LEVEL: info
      CORS_ORIGINS: "http://localhost:8080,http://localhost:8501,http://localhost"
      EMBEDDING_MODEL_PATH: /app/models/embedding_engine.pkl
    volumes:
      - ../models:/app/models:ro
      - ../data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── Static HTML dashboard ──────────────────────────────────────
  ui:
    image: nginx:alpine
    container_name: exai-ui
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../ui:/usr/share/nginx/html:ro

  # ─── Streamlit application ──────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.streamlit
    image: exai-streamlit:latest
    container_name: exai-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ../models:/app/models:ro
      - ../data:/app/data
    environment:
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0

  # ─── Nginx reverse proxy ────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: exai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - ui
      - app

networks:
  default:
    name: exai-network
