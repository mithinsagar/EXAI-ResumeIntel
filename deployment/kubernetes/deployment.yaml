# EXAI-ResumeIntel: Kubernetes deployment manifest
# Author: Mithin Sagar S
# GitHub: https://github.com/mithinsagar
#
# Apply with:
#   kubectl apply -f deployment/kubernetes/deployment.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: exai-resumeintel
  labels:
    app.kubernetes.io/name: exai-resumeintel
    app.kubernetes.io/managed-by: kubectl

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: exai-config
  namespace: exai-resumeintel
data:
  API_HOST: "0.0.0.0"
  API_PORT: "8765"
  API_LOG_LEVEL: "info"
  CORS_ORIGINS: "*"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: exai-api
  namespace: exai-resumeintel
  labels:
    app: exai-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: exai-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: exai-api
    spec:
      containers:
        - name: exai-api
          image: mithinsagar/exai-resumeintel:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8765
          envFrom:
            - configMapRef:
                name: exai-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8765
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8765
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

---

apiVersion: v1
kind: Service
metadata:
  name: exai-api
  namespace: exai-resumeintel
  labels:
    app: exai-api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8765
      targetPort: 8765
      protocol: TCP
  selector:
    app: exai-api

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: exai-ingress
  namespace: exai-resumeintel
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - exai-resumeintel.example.com
      secretName: exai-tls
  rules:
    - host: exai-resumeintel.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: exai-api
                port:
                  number: 8765

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: exai-api-hpa
  namespace: exai-resumeintel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: exai-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
