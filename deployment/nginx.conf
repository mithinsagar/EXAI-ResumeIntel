# EXAI-ResumeIntel: Nginx reverse proxy configuration
# Author: Mithin Sagar S
# GitHub: https://github.com/mithinsagar
#
# Routes:
#   /                 -> static UI (landing + analyzer)
#   /api/             -> FastAPI backend
#   /app/             -> Streamlit application
#   /docs and /redoc  -> Swagger UI and ReDoc

upstream exai_api {
    server api:8765;
}

upstream exai_app {
    server app:8501;
}

upstream exai_ui {
    server ui:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # ─── Static UI (default) ─────────────────────────────────────
    location / {
        proxy_pass http://exai_ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── FastAPI ─────────────────────────────────────────────────
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://exai_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /docs {
        proxy_pass http://exai_api/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://exai_api/redoc;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://exai_api/openapi.json;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://exai_api/health;
        proxy_set_header Host $host;
    }

    # ─── Streamlit application ───────────────────────────────────
    location /app/ {
        proxy_pass http://exai_app/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamlit websockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # ─── Health probe ────────────────────────────────────────────
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
