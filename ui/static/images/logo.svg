<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="EXAI-ResumeIntel logo">
  <title>EXAI-ResumeIntel</title>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#6c63ff"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#g)" stroke-width="4" opacity="0.35"/>

  <!-- Inner core -->
  <circle cx="100" cy="100" r="60" fill="url(#g)" opacity="0.15"/>

  <!-- Neural nodes -->
  <circle cx="60"  cy="70"  r="6" fill="url(#g)"/>
  <circle cx="140" cy="70"  r="6" fill="url(#g2)"/>
  <circle cx="100" cy="100" r="10" fill="url(#g)"/>
  <circle cx="60"  cy="130" r="6" fill="url(#g2)"/>
  <circle cx="140" cy="130" r="6" fill="url(#g)"/>

  <!-- Connections -->
  <g stroke="url(#g)" stroke-width="2" opacity="0.55" fill="none">
    <line x1="60" y1="70" x2="100" y2="100"/>
    <line x1="140" y1="70" x2="100" y2="100"/>
    <line x1="60" y1="130" x2="100" y2="100"/>
    <line x1="140" y1="130" x2="100" y2="100"/>
  </g>

  <!-- Center label -->
  <text x="100" y="106" text-anchor="middle" fill="#fff" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="800" letter-spacing="1">EXAI</text>
</svg>
